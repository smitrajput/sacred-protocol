[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "../deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/",
  "solady/=lib/solady/src/",
  "solmate/=lib/solmate/",
]

[fuzz]
runs = 1000

[invariant]
runs = 64
depth = 120
fail_on_revert = false

[lint]
lint_on_build = false
